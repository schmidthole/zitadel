name: Login App Fork Image

on:
  push:
    branches:
      - login-app-fork
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/zitadel-login
  NEXT_PUBLIC_BASE_PATH: /ui/v2/login
  NEXT_PUBLIC_APPLICATION_NAME: SwiftConnect
  NEXT_PUBLIC_THEME_ROUNDNESS: mid
  NEXT_PUBLIC_THEME_LAYOUT: top-to-bottom
  NEXT_PUBLIC_THEME_APPEARANCE: glass
  NEXT_PUBLIC_THEME_SPACING: compact

jobs:
  docker:
    name: Build and publish login image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Login standalone
        env:
          NX_DAEMON: "false"
          NX_DISABLE_DB: "true"
        run: pnpm nx run --nxBail @zitadel/login:build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.28.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: login-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.documentation=https://zitadel.com/docs
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=ZITADEL
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=raw,value=login-app-fork

      - name: Build and push Login image
        uses: docker/build-push-action@v6
        timeout-minutes: 5
        with:
          context: apps/login
          cache-from: type=gha,scope=login
          cache-to: type=gha,mode=max,scope=login
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.login-meta.outputs.labels }}
          tags: ${{ steps.login-meta.outputs.tags }}
